<style>
:root{--bg:#f4f6f8;--pri:#0b5ea8;--fc:#222;--fs:15px}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fc);font-size:var(--fs)}
header{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}header img{height:46px;border-radius:6px;background:#fff}header h1{margin:0;font-size:1.2em;flex:1}
nav{display:flex;gap:4px;padding:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ccc}
button,.b{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}button.g{background:#777}button.r{background:#c0392b}nav button.on{outline:3px solid #f1c40f}
main{padding:10px}.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}input,select{font:inherit;padding:6px;border:1px solid #aaa;border-radius:6px;max-width:100%}
.w{overflow:auto;background:#fff;border-radius:8px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:5px 8px;white-space:nowrap}th{background:var(--pri);color:#fff;position:sticky;top:0}
dialog{border:0;border-radius:10px;min-width:min(420px,95vw);max-height:90vh;overflow:auto}label{display:block;margin:6px 0}label input,label select{width:100%}
#lg{max-width:340px;margin:12vh auto;background:#fff;padding:20px;border-radius:10px}
#tt{display:none;position:fixed;top:0;left:0;right:0;background:#1e8e3e;color:#fff;text-align:center;padding:12px;z-index:9999;font-weight:bold;box-shadow:0 2px 8px #0005}</style></head><body><div id="app"></div><dialog id="dlg"></dialog>

function edit(i){const sc=SC[tab],o=i<0?(tab=='visits'?{date:new Date().toISOString().slice(0,10),day:new Date().toLocaleDateString('ar',{weekday:'long'})}:{}):D[tab][i];$('#dlg').innerHTML=`<form method=dialog onsubmit="return false"><h3>${i<0?'إضافة':'تعديل'} - ${sc.t}</h3>${sc.c.filter(c=>main()||tab!='visits'||!['repNo','repName'].includes(c[0])).map(c=>`<label>${c[1]}<input name=${c[0]} value="${E(o[c[0]])}" ${c[2]?`list=L${c[2]}`:''}></label>`).join('')}<datalist id=Lcust>${D.customers.map(x=>`<option>${E(x.customer)}`).join('')}</datalist><datalist id=Lcls>${D.cls.map(x=>`<option>${E(x.name)}`).join('')}</datalist><datalist id=Lsts>${D.sts.map(x=>`<option>${E(x.name)}`).join('')}</datalist><button id=ok>حفظ</button> <button class=g type=button onclick="dlg.close()">إلغاء</button></form>`;
$('#ok').onclick=async()=>{const n={};$('#dlg').querySelectorAll('input[name]').forEach(e=>n[e.name]=e.value);if(tab=='visits'&&!main()){n.repNo=String(U.repNo);n.repName=(D.visits.find(v=>String(v.repNo)==String(U.repNo))||{}).repName||U.user}
if(tab=='users'){if(i<0){if(!n.pass||n.pass.length<6)return alert('كلمة المرور 6 أحرف على الأقل');if(!['main','sub'].includes(n.role))return alert('الصلاحية main أو sub');const{data,error}=await sb2.auth.signUp({email:em(n.user),password:n.pass});if(error||!data.user)return err(error||'فشل');const r=await sb.from('profiles').insert({id:data.user.id,username:n.user.trim().toLowerCase(),role:n.role,rep_no:n.repNo||null});if(r.error)return err(r.error)}else{const r=await sb.from('profiles').update({role:n.role,rep_no:n.repNo||null}).eq('id',D.users[i]._id);if(r.error)return err(r.error)}}
else if(i<0){if(!await ins(tab,[n]))return}else{const{error}=await sb.from('records').update({rep_no:tab=='visits'?String(n.repNo||''):null,data:n}).eq('id',D[tab][i]._id);if(error)return err(error)}
await load();dlg.close();draw();toast(i<0?'تمت الإضافة بنجاح':'تم التعديل بنجاح')};dlg.showModal()}
async function del(i){if(!confirm('حذف السجل؟'))return;const id=D[tab][i]._id;if(id==U.id)return alert('لا يمكن حذف حسابك');const{error}=tab=='users'?await sb.rpc('admin_delete_user',{uid:id}):await sb.from('records').delete().eq('id',id);if(error)return err(error);await load();draw();toast('تم الحذف بنجاح')}
function srch(){const f=[['repNo','رقم المندوب'],['repName','اسم المندوب'],['customer','اسم العميل'],['scope','المدينة'],['area','المنطقة']];
$('#m').innerHTML=bar('')+`<div class=bar>${f.map(a=>`<input placeholder="${a[1]}" value="${E(S.r[a[0]]||'')}" oninput="S.r['${a[0]}']=this.value;sr()" ${!main()&&a[0]=='repNo'?'disabled':''}>`).join('')}</div><div class=w id=tw></div>`;sr()}
function sr(){const c=SC.visits.c;let r=list('visits').filter(v=>Object.entries(S.r).every(([k,x])=>!x||String(v[k]??'').includes(x))).reverse();cur={title:'نتائج البحث',cols:c,rows:r};
$('#tw').innerHTML=`<p><b>عدد الزيارات: ${r.length}</b></p><table><tr>${c.map(a=>`<th>${a[1]}</th>`).join('')}</tr>${r.slice(0,300).map(x=>`<tr>${c.map(a=>`<td>${E(x[a[0]])}</td>`).join('')}</tr>`).join('')}</table>`}
function aoa(){const s=D.set;return [[s.org],[cur.title+' — '+[s.addr,s.p1,s.email].filter(Boolean).join(' | ')],cur.cols.map(c=>c[1]),...cur.rows.map(r=>cur.cols.map(c=>r[c[0]]??''))]}
function wb(){const w=XLSX.utils.book_new(),s=XLSX.utils.aoa_to_sheet(aoa());s['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(w,s,cur.title.slice(0,30));return w}
function xl(){XLSX.writeFile(wb(),cur.title+'.xlsx')}
function imp(el){const f=el.files[0];if(!f)return;const k=cur.key,r=new FileReader();r.onload=async e=>{const w=XLSX.read(e.target.result),a=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:''}),sc=SC[k];if(!sc)return alert('الاستيراد من نافذة بيانات');const h=a.findIndex(x=>x.includes(sc.c[0][1]));if(h<0)return alert('الأعمدة غير مطابقة — صدّر الملف أولاً واستخدم نفس الأعمدة');const hd=a[h];const rows=[];a.slice(h+1).forEach(x=>{const o={};sc.c.forEach(c=>{const j=hd.indexOf(c[1]);o[c[0]]=j<0?'':String(x[j])});if(Object.values(o).some(Boolean))rows.push(o)});if(k=='users')return alert('غير مدعوم');if(rows.length&&await ins(k,rows)){await load();alert('تم استيراد '+rows.length);draw()}};r.readAsArrayBuffer(f)}
function pdf(){const s=D.set,w=open('','_blank');w.document.write(`<html dir=rtl><meta charset=utf-8><style>body{font-family:Tahoma}table{border-collapse:collapse;width:100%;font-size:11px}td,th{border:1px solid #888;padding:3px}th{background:#ddd}.h{display:flex;align-items:center;gap:12px}</style><div class=h>${s.logo?`<img src="${s.logo}" height=60>`:''}<div><h2 style=margin:0>${E(s.org)}</h2>${E([s.addr,s.p1,s.p2,s.email,s.extra].filter(Boolean).join(' | '))}</div></div><h3>${E(cur.title)}</h3><table><tr>${cur.cols.map(c=>`<th>${c[1]}`).join('')}</tr>${cur.rows.map(r=>`<tr>${cur.cols.map(c=>`<td>${E(r[c[0]])}`).join('')}`).join('')}</table><script>setTimeout(()=>print(),400)<\/script></html>`);w.document.close()}
async function tg(){const s=D.set;if(!s.tgT||!s.tgC)return alert('أدخل توكن البوت ومعرّف المحادثة في الإعدادات');const b=new Blob([XLSX.write(wb(),{type:'array',bookType:'xlsx'})]),f=new FormData();f.append('chat_id',s.tgC);f.append('document',b,cur.title+'.xlsx');try{const r=await fetch(`https://api.telegram.org/bot${s.tgT}/sendDocument`,{method:'POST',body:f});alert((await r.json()).ok?'تم الإرسال':'فشل الإرسال')}catch(e){alert('تعذر الاتصال')}}
function sets(){const s=D.set,f=[['org','اسم المؤسسة'],['addr','مكان الشركة'],['email','الإيميل'],['p1','رقم الهاتف 1'],['p2','رقم الهاتف 2'],['extra','إضافات أخرى'],['bg','لون الخلفية','color'],['pri','لون الواجهة','color'],['fc','لون الخط','color'],['fs','حجم الخط','number'],['bkDays','التذكير بالنسخ الاحتياطي كل (يوم) - الافتراضي 7','number'],['tgT','توكن بوت تيليغرام'],['tgC','معرّف المحادثة Chat ID']];
$('#m').innerHTML=`<div style="max-width:520px;background:#fff;padding:14px;border-radius:8px">${f.map(a=>`<label>${a[1]}<input type=${a[2]||'text'} value="${E(s[a[0]])}" onchange="D.set['${a[0]}']=this.value;save();theme()"></label>`).join('')}<label>شعار المؤسسة<input type=file accept=image/* onchange=logo(this)></label><label><input type=checkbox style=width:auto ${s.mask?'checked':''} onchange="D.set.mask=this.checked;save()"> إخفاء اسم المستخدم وكلمة المرور (****) في نافذة المستخدمين</label><button onclick=draw()>تطبيق</button><hr><b>النسخ الاحتياطي</b><p>آخر نسخة احتياطية: ${s.lastBackup?new Date(s.lastBackup).toLocaleString('ar'):'لا توجد'}</p><button class=g onclick=backup()>نسخة احتياطية (JSON)</button> <button class=g onclick=backupXl()>نسخة Excel</button> <label class=b style=background:#c0392b>استعادة من نسخة<input type=file hidden accept=.json onchange=restore(this)></label></div>`}
function logo(el){const r=new FileReader();r.onload=e=>{D.set.logo=e.target.result;save();draw()};r.readAsDataURL(el.files[0])}
try{const m=new Blob([JSON.stringify({name:'مؤسسة معاذ الحسين',short_name:'معاذ الحسين',display:'standalone',start_url:'.',icons:[{src:LOGO,sizes:'192x192'}]})],{type:'application/json'});const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(m);document.head.append(l)}catch(e){}
async function bulk(){const todo=D.reps.filter(r=>r.repNo&&!D.users.some(u=>u.role=='sub'&&String(u.repNo)==String(r.repNo)));
if(!todo.length)return alert('لكل المندوبين حسابات بالفعل');if(!confirm('سيتم إنشاء '+todo.length+' حساباً. لا تغلق الصفحة أثناء ذلك. متابعة؟'))return;
const out=[],al='abcdefghjkmnpqrstuvwxyz23456789';
for(const r of todo){$('#m').innerHTML='<p>جارٍ إنشاء الحسابات: '+out.length+' / '+todo.length+'</p>';
const user='rep'+String(r.repNo).trim(),pw=Array.from({length:8},()=>al[Math.floor(Math.random()*al.length)]).join('');
const{data,error}=await sb2.auth.signUp({email:em(user),password:pw});
if(error||!data.user){out.push([r.repNo,r.repName,user,'فشل: '+((error&&error.message)||'')]);if(error&&/rate/i.test(error.message))break;continue}
const p=await sb.from('profiles').insert({id:data.user.id,username:user,role:'sub',rep_no:String(r.repNo)});
out.push([r.repNo,r.repName,user,p.error?'فشل: '+p.error.message:pw]);await new Promise(s=>setTimeout(s,1500))}
await load();cur={title:'حسابات المندوبين',cols:[['a','رقم المندوب'],['b','اسم المندوب'],['c','اسم المستخدم'],['d','كلمة المرور']],rows:out.map(x=>({a:x[0],b:x[1],c:x[2],d:x[3]}))};
$('#m').innerHTML='<div class=bar><button class=g onclick=xl()>Excel ⬇</button><button class=g onclick=pdf()>PDF / طباعة</button></div><p><b>احفظ هذه القائمة الآن: كلمات المرور لا تُعرض مرة أخرى.</b></p><div class=w><table><tr><th>رقم</th><th>الاسم</th><th>المستخدم</th><th>كلمة المرور</th></tr>'+out.map(x=>'<tr>'+x.map(v=>'<td>'+E(v)+'</td>').join('')+'</tr>').join('')+'</table></div>'}

async function pw(i){const u=D.users[i],p=prompt('كلمة المرور الجديدة للمستخدم '+u.user+' (6 أحرف فأكثر)');if(!p)return;if(p.length<6)return alert('6 أحرف على الأقل');const{error}=await sb.rpc('admin_set_password',{uid:u._id,pw:p});if(error)return err(error);alert('تم تغيير كلمة المرور')}
async function mypw(){const p=prompt('كلمة المرور الجديدة (6 أحرف فأكثر)');if(!p)return;if(p.length<6)return alert('6 أحرف على الأقل');const{error}=await sb.auth.updateUser({password:p});if(error)return err(error);alert('تم تغيير كلمة المرور')}

const KS=['visits','customers','reps','cls','sts'],dt=()=>new Date().toISOString().slice(0,10);
async function backup(){await load();const d={v:1,at:new Date().toISOString(),set:{}};Object.keys(D.set).forEach(k=>{if(!PRIV.includes(k))d.set[k]=D.set[k]});KS.forEach(k=>d[k]=D[k].map(strip));d.users=D.users.map(u=>({user:u.user,role:u.role,repNo:u.repNo}));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup-'+dt()+'.json';a.click();D.set.lastBackup=new Date().toISOString();await saveSet()}
async function backupXl(){await load();const w=XLSX.utils.book_new();KS.forEach(k=>{const sc=SC[k],s=XLSX.utils.aoa_to_sheet([sc.c.map(c=>c[1]),...D[k].map(r=>sc.c.map(c=>r[c[0]]??''))]);s['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(w,s,sc.t.slice(0,30))});XLSX.writeFile(w,'backup-'+dt()+'.xlsx')}
async function restore(el){const f=el.files[0];el.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return alert('ملف غير صالح')}
if(!d.v||!d.visits)return alert('ليست نسخة احتياطية صحيحة');
if(!confirm('سيتم حذف البيانات الحالية (الزيارات والعملاء والمندوبين والقوائم) واستبدالها بالنسخة. متابعة؟'))return;
if(prompt('للتأكيد اكتب: استعادة')!='استعادة')return;
await backup();const{error}=await sb.from('records').delete().in('kind',KS);if(error)return err(error);
for(const k of['customers','reps','visits','cls','sts'])for(let i=0;i<(d[k]||[]).length;i+=300)if(!await ins(k,d[k].slice(i,i+300)))return alert('توقفت الاستعادة. أعد المحاولة بنفس الملف');
await load();alert('تمت الاستعادة');draw()}

function bkBanner(){if(!U||!main())return'';const s=D.set,days=+s.bkDays||7,last=s.lastBackup?new Date(s.lastBackup):null,ago=last?Math.floor((Date.now()-last)/864e5):0;if(last&&ago<days)return'';
return `<div style="background:#fff3cd;border:1px solid #e0a800;color:#533f03;padding:8px;margin:8px;border-radius:8px">⚠️ ${last?'مضى '+ago+' يوماً على آخر نسخة احتياطية':'لم تؤخذ نسخة احتياطية بعد'} — <button onclick="backup().then(draw)">خذ نسخة الآن</button></div>`}

function toast(m){let e=$('#tt');if(!e){e=document.createElement('div');e.id='tt';document.body.append(e)}e.textContent='✓ '+m;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>e.style.display='none',3000)}
setInterval(async()=>{if(!U||document.hidden||dlg.open||tab=='set'||!$('#tw'))return;window._q=1;try{await load()}finally{window._q=0}if(!$('#tw'))return;tab=='search'?sr():SC[tab]?tbl2():0},60000);
loadSet().then(async()=>{const{data:{session}}=await sb.auth.getSession();session?enter():login()});
</script></body></html>
